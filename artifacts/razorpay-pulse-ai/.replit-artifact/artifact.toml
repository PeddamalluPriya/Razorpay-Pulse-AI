kind = "web"
previewPath = "/"
title = "Razorpay Pulse AI"
description = "A production-shaped payments intelligence workspace for merchants to understand failures, reduce fraud, simulate recovered revenue, and act on explainable analytics."
version = "1.0.0"
id = "artifacts/razorpay-pulse-ai"
router = "path"
videoAspectRatio = "16:9"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21624

[services.development]
run = "pnpm --filter @workspace/razorpay-pulse-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/razorpay-pulse-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/razorpay-pulse-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21624"
BASE_PATH = "/"
